version: 2.1

workflows:
  build-deploy:
    jobs:
      - build-and-scan
      - test
      - kubernetes-runner
      - self-hosted-ec2-runner
      - sonar-scan:
          requires:
            - build-and-scan
            - test
      - hold:
          type: approval
          requires:
            - sonar-scan
          filters:
            branches:
              only: master
      - deploy:
          requires:
            - hold
          filters:
            branches:
              only: master

jobs:
  build-and-scan:
    docker:
      - image: cimg/base:2021.11
    steps:
      - checkout
      - run:
          name: Install Dependencies
          command: echo "Mock - Installing dependencies..."
      - run:
          name: Snyk Security Scan
          command: echo "Mock - Running Snyk scan... No vulnerabilities found."

  test:
    docker:
      - image: cimg/base:2021.11
    parallelism: 2
    steps:
      - checkout
      - run:
          name: Start Selenium
          command: echo "Mock - Selenium server started on port 4444"
      - run:
          name: Start Flask App
          command: echo "Mock - Flask app